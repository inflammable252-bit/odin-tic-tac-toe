<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css-reset.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Tic-Tac-Toe</title>
</head>
<body>
    <main class="center"><div class="center-wrapper">
            <article class="board">
                <div class="cell"></div>
                <div class="cell" ></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </article>
            <p class="system-msg"></p>
            <nav>
                <article class="score-display">
                    <div class="p-wrapper">
                        <img id="p1-icon" src="./cross-svgrepo-com.svg" alt="Player 1 icon: X">
                        <p id="p1">
                            <span id="name">player1</span>
                            <input type="text" name="p1-name" id="p1-name" minlength="1" maxlength="12">
                            <span>:</span>
                            <span id="p1-score">0</span></p>
                        <img id="p2-icon" src="circle-svgrepo-com.svg" alt="Player 2 icon: O">
                        <p id="p2">
                            <span id="name">player2</span>
                            <input type="text" name="p2-name" id="p2-name" minlength="1" maxlength="12">
                            <span>:</span>
                            <span id="p2-score">0</span></p>
                    </div>
                    <button id="edit">Edit players</button>
                </article>
                <div class="button-wrapper">
                    <button id="auto-move" title="Let the computer decide!">Computer</button>
                    <div id="game-edit">
                        <button id="restart">Restart Game</button>
                        <button id="round" class="off" title="Start a new round after completing the current one.">New Round</button>
                    </div>
                </div>
            </nav>
        </div>
    </main>
    <footer></footer>
</body>
</html>
